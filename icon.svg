<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5C7CFA"/>
      <stop offset="1" stop-color="#2F43C9"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9DBDFF"/>
      <stop offset="1" stop-color="#DCE8FF"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FA9F5"/>
      <stop offset="1" stop-color="#6C83E8"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E66E0"/>
      <stop offset="1" stop-color="#3142B8"/>
    </linearGradient>
  </defs>

  <!-- 底色：蓝紫渐变圆角方块 -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- 图片：左侧大图框（带投影） -->
  <rect x="52" y="88" width="228" height="344" rx="36" fill="#12206B" opacity="0.28"/>
  <rect x="48" y="84" width="228" height="344" rx="36" fill="#FFFFFF"/>

  <clipPath id="photo">
    <rect x="48" y="84" width="228" height="344" rx="36"/>
  </clipPath>

  <g clip-path="url(#photo)">
    <!-- 天空 -->
    <rect x="48" y="84" width="228" height="164" fill="url(#sky)"/>
    <!-- 太阳 -->
    <circle cx="128" cy="148" r="34" fill="#FFD166"/>
    <!-- 远山 -->
    <polygon points="32,300 148,168 264,300" fill="url(#far)"/>
    <!-- 近山 -->
    <polygon points="56,368 200,212 292,368" fill="url(#near)"/>
    <!-- 前景 -->
    <polygon points="48,428 48,376 122,322 196,358 276,320 276,428" fill="#1F2E9E" opacity="0.45"/>
  </g>

  <!-- 文字：大号 A + 三行文本 -->
  <g stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M426,120 L378,246"/>
    <path d="M426,120 L474,246"/>
    <path d="M390,196 L462,196"/>
  </g>
  <rect x="356" y="282" width="118" height="18" rx="9" fill="#FFFFFF" opacity="0.9"/>
  <rect x="356" y="316" width="92" height="18" rx="9" fill="#FFFFFF" opacity="0.9"/>
  <rect x="356" y="350" width="104" height="18" rx="9" fill="#FFFFFF" opacity="0.9"/>
</svg>
